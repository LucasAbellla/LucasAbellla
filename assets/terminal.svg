<svg xmlns="http://www.w3.org/2000/svg" width="300" height="230" viewBox="0 0 300 230" role="img" aria-label="Terminal: whoami, Lucas Abella; focus, web, APIs and game mechanics">
  <title>whoami</title>
  <style>
    text { font-family: Consolas, 'Cascadia Mono', 'SFMono-Regular', Menlo, 'Courier New', monospace; font-size: 13px; }
    .p { fill: #7d7d7d; }
    .c { fill: #f2f2f2; }
    .o { fill: #bdbdbd; }
    .l { opacity: 0; animation: show 0.01s linear forwards; }
    .l1 { animation-delay: 0.4s; } .l2 { animation-delay: 1.1s; } .l3 { animation-delay: 1.8s; }
    .l4 { animation-delay: 2.5s; } .l5 { animation-delay: 2.9s; } .l6 { animation-delay: 3.3s; } .l7 { animation-delay: 4s; }
    .cur { animation: blink 1s steps(1) infinite 4s; opacity: 0; }
    @keyframes show { to { opacity: 1; } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .l { animation: none; opacity: 1; } .cur { animation: none; opacity: 1; } }
  </style>
  <rect x="0.5" y="0.5" width="299" height="229" rx="8" fill="#0d0d0d" stroke="#2b2b2b"/>
  <path d="M0.5 30 V8.5 a8 8 0 0 1 8-8 h283 a8 8 0 0 1 8 8 V30 Z" fill="#161616"/>
  <circle cx="18" cy="15.5" r="4.5" fill="#3a3a3a"/>
  <circle cx="33" cy="15.5" r="4.5" fill="#3a3a3a"/>
  <circle cx="48" cy="15.5" r="4.5" fill="#3a3a3a"/>
  <text x="150" y="20" text-anchor="middle" class="p" style="font-size:11px">lucas@github: ~</text>

  <text x="16" y="58" class="l l1"><tspan class="p">$ </tspan><tspan class="c">whoami</tspan></text>
  <text x="16" y="78" class="l l2 o">lucas abella</text>
  <text x="16" y="108" class="l l3"><tspan class="p">$ </tspan><tspan class="c">cat focus.txt</tspan></text>
  <text x="16" y="128" class="l l4 o">- web development</text>
  <text x="16" y="146" class="l l5 o">- APIs</text>
  <text x="16" y="164" class="l l6 o">- digital game mechanics</text>
  <text x="16" y="194" class="l l7"><tspan class="p">$ </tspan></text>
  <rect x="32" y="183" width="8" height="15" fill="#f2f2f2" class="cur"/>
</svg>
