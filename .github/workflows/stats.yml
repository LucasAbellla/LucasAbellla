# Rebuilds the statistics cards of the profile README (assets/*.svg) once a day.
name: Profile stats

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/stats.mjs', '.github/workflows/stats.yml']

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the cards
        run: node scripts/stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
      - name: Commit the cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats.svg assets/streak.svg assets/contributions.svg assets/languages.svg
          if git diff --cached --quiet; then echo 'Nothing changed.'; exit 0; fi
          git commit -m 'Update profile stats'
          git push
